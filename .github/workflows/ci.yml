# Gazette — CI (Brunel, chaufferie). Standard maison : chaque push testé,
# compilé, emballé. Échecs bavards : jamais un vert muet.
# Note de la tranche fondations : le lockfile n'est pas encore engendré (npm
# refusé au banc de la maison) — npm install à la CI v0, épinglage exact à la
# génération du package-lock, dette consignée au registre.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "docs/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      - name: Typecheck strict
        run: npm run typecheck

      - name: Tests (vitest run)
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Diagnostic si rouge
        if: failure()
        run: |
          echo "=== CI ROUGE — le banc exige le diagnostic ==="
          npm ls --depth=0 || true
